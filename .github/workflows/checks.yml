name: Checks
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netsrow
          POSTGRES_PASSWORD: netsrow_ci
          POSTGRES_DB: netsrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsrow -d netsrow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://netsrow:netsrow_ci@127.0.0.1:5432/netsrow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run api:check
      - run: npm run lint
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Verify the catalog endpoint
        run: |
          node --import tsx server/main.ts &
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3001/api/health
          curl --fail --silent http://127.0.0.1:3001/api/demo/catalog | node -e 'const d = JSON.parse(require("node:fs").readFileSync(0)); if (d.mode !== "demo" || !d.catalog.plans.length) process.exit(1)'
