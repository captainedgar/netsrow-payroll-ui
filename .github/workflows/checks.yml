name: Checks
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netsrow
          POSTGRES_PASSWORD: netsrow_ci
          POSTGRES_DB: netsrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsrow -d netsrow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://netsrow:netsrow_ci@127.0.0.1:5432/netsrow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run api:check
      - run: npm run lint
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: NETSROW_SEED_TEST_TENANTS=true npm run db:seed:tenants
      - name: Verify frontend, API proxy and PostgreSQL
        run: |
          export NETSROW_COMMERCIAL_INTAKE=true
          node --import tsx server/main.ts &
          api_pid=$!
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 3000 --strictPort &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT

          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3001/api/health
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/base-tecnica
          curl --fail --silent --show-error http://127.0.0.1:3000/api/demo/catalog | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const data = JSON.parse(readFileSync(0, "utf8"));
            if (data.mode !== "demo" || !data.catalog?.plans?.length) {
              throw new Error("Expected seeded demo plans through the Vite proxy");
            }'
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/tenant/catalog)
          test "$status" = 401
          node --import tsx server/commercial-smoke.ts
          node --import tsx server/tenant-smoke.ts
